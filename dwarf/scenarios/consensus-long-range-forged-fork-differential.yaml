{
  "spec_version": "v1",
  "id": "consensus-long-range-forged-fork-differential",
  "title": "Long-range forged-fork rejection differential (S1b) — cardano-node and Amaru both refuse a real, validly-signed, longer fork that branches >k back",
  "authors": [
    "dwarf"
  ],
  "tags": [
    "consensus",
    "long-range",
    "costless-simulation",
    "forged-fork",
    "deep-fork",
    "chain-selection",
    "security-parameter-k",
    "genesis-density",
    "differential",
    "amaru",
    "db-synthesizer"
  ],
  "evidence_intent": "candidate",
  "target": {
    "implementation": "cardano-node",
    "version": "10.7.1"
  },
  "runtime": "devnet",
  "seed": "0x0f04",
  "iterations": 1,
  "shrink": false,
  "attach": {
    "topology": "cardano_amaru",
    "network_magic": 42,
    "security_parameter_k": 5
  },
  "harness": {
    "note": "Executed via the Plan B forge pipeline + real cardano-node relays, NOT the primitive runner. Unlike S1 (which COMMANDS a rollback over chain-sync), this serves a genuinely-forged, validly-signed alternative chain and forces the node's real chain-selection decision.",
    "forge": {
      "tools": "ouroboros-consensus-cardano db-truncater + db-synthesizer + immdb-server (v0.25.1.0)",
      "steps": "copy a honest chain-db; db-truncater to fork point N-D (block 30500, > k behind); db-synthesizer --append with an honest operator's real KES/VRF/opcert credentials forges a validly-signed alternative continuation in LOGICAL slot time (no wall-clock/KES-exhaustion), producing the forged fork (tip block 30553, forking at 30500)."
    },
    "serve": "The forged fork is served by a REAL cardano-node relay (attacker-relay) seeded at the forged chain-db, isolated from honest, with a topology that dials the victim back (the inbound conn Amaru needs for block-fetch) and ProtocolIdleTimeout raised to 600s. Amaru peers cleanly with cardano-node relays where it choked on immdb-server directly.",
    "victims": "Each victim (a cardano-node and an Amaru node) is seeded on the honest chain at block 30520 (just past the fork point) so the forged fork (30553) is genuinely LONGER from its view but forks 20 blocks (> k=5) back."
  },
  "oracle": {
    "safety_property": "No honest node adopts an alternative fork that requires rolling back more than k blocks, even when that fork is genuinely longer and validly signed.",
    "differential": "cardano-node and Amaru must make the identical decision. A divergence (one adopts the forged fork, one refuses) is the finding.",
    "measure": "Per victim, the selected tip must not switch to the forged fork's blocks (30521..30553); it must stay on its honest chain at 30520."
  },
  "assertions": [
    {
      "primitive": "forged_fork_refused",
      "target_node_ids": [ "victim-cardano-node" ],
      "fork_point_block": 30500,
      "victim_block": 30520,
      "fork_tip_block": 30553,
      "security_parameter_k": 5
    },
    {
      "primitive": "forged_fork_refused",
      "target_node_ids": [ "victim-amaru" ],
      "fork_point_block": 30500,
      "victim_block": 30520,
      "fork_tip_block": 30553,
      "security_parameter_k": 5
    },
    {
      "primitive": "differential_agree",
      "reference_node_ids": [ "victim-cardano-node" ],
      "target_node_ids": [ "victim-amaru" ]
    }
  ],
  "teardown": []
}
