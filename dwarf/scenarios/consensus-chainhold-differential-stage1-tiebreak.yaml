{
  "spec_version": "v1",
  "id": "consensus-chainhold-differential-stage1-tiebreak",
  "title": "Chain-selection differential (stage 1) — cardano-node vs native Amaru relays agree on the same tip under real forks / VRF tiebreak (upstream mesh, direct comparison)",
  "authors": [
    "dwarf"
  ],
  "tags": [
    "consensus",
    "chainhold",
    "differential",
    "chain-selection",
    "vrf-tiebreak",
    "amaru",
    "common-prefix",
    "upstream-topology",
    "direct-amaru"
  ],
  "evidence_intent": "candidate",
  "target": {
    "implementation": "cardano-node",
    "version": "10.7.1"
  },
  "runtime": "devnet",
  "seed": "0x0a1b2c3d",
  "iterations": 1,
  "shrink": false,
  "attach": {
    "topology": "cardano_amaru",
    "network_magic": 42
  },
  "setup": [
    {
      "primitive": "runtime_attach_topology",
      "output_dir": "outputs/attach",
      "topology": "cardano_amaru",
      "network_magic": 42
    }
  ],
  "load": [
    {
      "primitive": "runtime_tracer_capture",
      "output_dir": "outputs/tracer",
      "tracer_container": "tracer",
      "prometheus_port": 4000
    },
    {
      "primitive": "runtime_multi_node_observation",
      "runtime_metadata_path": "outputs/attach/runtime.json",
      "node_ids": [ "relay1", "relay2", "amaru-relay-1", "amaru-relay-2" ],
      "observation_window_seconds": 90,
      "sample_interval_seconds": 3,
      "network_magic": 42,
      "observation_primitives": [ "tip_state" ],
      "timeout_seconds": 180,
      "output_dir": "outputs/multi-node-observation"
    }
  ],
  "probes": [],
  "assertions": [
    {
      "primitive": "chain_select_differential",
      "reference_node_ids": [ "relay1", "relay2" ],
      "target_node_ids": [ "amaru-relay-1", "amaru-relay-2" ],
      "tolerance_slots": 5,
      "require_real_progress": true
    }
  ],
  "teardown": []
}
