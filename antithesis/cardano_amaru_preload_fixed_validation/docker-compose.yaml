services:
  amaru-consumer:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment:
      CARDANO_BLOCK_PRODUCER: false
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n\
      \  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect\
      \ /tracer/tracer.socket\n  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m\
      \ -qg -qb -RTS\n"
    restart: always
    depends_on:
      configurator:
        condition: service_completed_successfully
      tracer-sidecar:
        condition: service_started
      amaru-consumer-seed:
        condition: service_completed_successfully
      amaru-relay-1:
        condition: service_started
      amaru-relay-2:
        condition: service_started
    container_name: amaru-consumer
    hostname: amaru-consumer.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    volumes:
    - p1-configs:/configs:ro
    - ./amaru-consumer-topology.json:/configs/configs/topology.json:ro
    - amaru-consumer-state:/state
    - tracer:/tracer
    networks:
      amaru-consumer-net: null
    platform: linux/amd64
    init: true
  amaru-consumer-seed:
    image: ghcr.io/lambdasistemi/amaru-bootstrap-producer@sha256:aabaf9e1fc1f58045329e14c1127c5424ba4794855d39bce05e3b426b7025c36
    container_name: amaru-consumer-seed
    hostname: amaru-consumer-seed.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint:
    - /bin/bash
    - -euo
    - pipefail
    - -c
    command:
    - "while [ ! -f /amaru-state/.bootstrap-complete ]; do sleep 5; done\nif [ -f\
      \ /seed/.seed-complete ]; then exit 0; fi\nwhile :; do\n  rm -rf /seed/.copy-tmp\n\
      \  mkdir -p /seed/.copy-tmp\n  if cp -a /live/immutable /live/ledger /live/volatile\
      \ /live/protocolMagicId /live/lock /seed/.copy-tmp/; then\n    find /seed -mindepth\
      \ 1 -maxdepth 1 ! -name .copy-tmp -exec rm -rf {} +\n    for entry in /seed/.copy-tmp/*;\
      \ do mv \"$${entry}\" /seed/; done\n    rmdir /seed/.copy-tmp\n    : > /seed/.seed-complete\n\
      \    exit 0\n  fi\n  rm -rf /seed/.copy-tmp\n  sleep 5\ndone\n"
    volumes:
    - p1-state:/live:ro
    - a1-state:/amaru-state:ro
    - amaru-consumer-state:/seed
    depends_on:
      p1:
        condition: service_started
      amaru-relay-1:
        condition: service_started
    restart: on-failure
    platform: linux/amd64
    init: true
  amaru-relay-1:
    image: ghcr.io/lambdasistemi/amaru-bootstrap-producer@sha256:aabaf9e1fc1f58045329e14c1127c5424ba4794855d39bce05e3b426b7025c36
    entrypoint: amaru-relay-bootstrap
    environment:
      AMARU_LOG: debug
      AMARU_COLOR: never
      AMARU_NETWORK: testnet_42
      AMARU_BOOTSTRAP_RETRY_SECONDS: '5'
      AMARU_WAIT_DEADLINE_SECONDS: '30'
      AMARU_CLUSTER_READY_DEADLINE_SECONDS: '30'
      AMARU_POLL_INTERVAL_SECONDS: '5'
      RELAY_NAME: amaru-relay-1
      AMARU_PEER: p1.example:3001
      AMARU_BIN: /target/amaru
      AMARU_MIGRATE_CHAIN_DB: 'true'
    restart: always
    hostname: amaru-relay-1.example
    volumes:
    - p1-state:/live:ro
    - p1-configs:/cardano/config:ro
    - ./amaru-runtime:/amaru-runtime:ro
    - amaru-startup:/startup
    - a1-state:/srv/amaru
    - type: volume
      source: amaru-target-bin
      target: /target
      read_only: true
    depends_on:
      p1:
        condition: service_started
      amaru-target-extract:
        condition: service_completed_successfully
        required: true
    networks:
      default: null
      amaru-consumer-net:
        aliases:
        - amaru-relay-1.example
    platform: linux/amd64
    init: true
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    container_name: amaru-relay-1
  amaru-relay-2:
    image: ghcr.io/lambdasistemi/amaru-bootstrap-producer@sha256:aabaf9e1fc1f58045329e14c1127c5424ba4794855d39bce05e3b426b7025c36
    entrypoint: amaru-relay-bootstrap
    environment:
      AMARU_LOG: debug
      AMARU_COLOR: never
      AMARU_NETWORK: testnet_42
      AMARU_BOOTSTRAP_RETRY_SECONDS: '5'
      AMARU_WAIT_DEADLINE_SECONDS: '30'
      AMARU_CLUSTER_READY_DEADLINE_SECONDS: '30'
      AMARU_POLL_INTERVAL_SECONDS: '5'
      RELAY_NAME: amaru-relay-2
      AMARU_PEER: p2.example:3001
      AMARU_BIN: /target/amaru
      AMARU_MIGRATE_CHAIN_DB: 'true'
    restart: always
    hostname: amaru-relay-2.example
    volumes:
    - p2-state:/live:ro
    - p2-configs:/cardano/config:ro
    - ./amaru-runtime:/amaru-runtime:ro
    - amaru-startup:/startup
    - a2-state:/srv/amaru
    - type: volume
      source: amaru-target-bin
      target: /target
      read_only: true
    depends_on:
      p2:
        condition: service_started
      amaru-target-extract:
        condition: service_completed_successfully
        required: true
    networks:
      default: null
      amaru-consumer-net:
        aliases:
        - amaru-relay-2.example
    platform: linux/amd64
    init: true
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    container_name: amaru-relay-2
  configurator:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/configurator@sha256:599a73a401e42b0922751458e92eb5ae432b5e3712153f8843def8ee15d79e4f
    container_name: configurator
    hostname: configurator.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint:
    - /bin/bash
    - -lc
    command:
    - "set -euo pipefail\n/configurator.sh\nshelley_start=\"$$(jq -r '.systemStart'\
      \ /configs/1/configs/shelley-genesis.json)\"\nbyron_start=\"$$(jq -r '.startTime'\
      \ /configs/1/configs/byron-genesis.json)\"\nfor dir in /configs/[123]; do\n\
      \  shelley=\"$$dir/configs/shelley-genesis.json\"\n  byron=\"$$dir/configs/byron-genesis.json\"\
      \n  jq --arg start \"$$shelley_start\" '.systemStart = $$start' \"$$shelley\"\
      \ > \"$$shelley.tmp\"\n  mv \"$$shelley.tmp\" \"$$shelley\"\n  jq --argjson\
      \ start \"$$byron_start\" '.startTime = $$start' \"$$byron\" > \"$$byron.tmp\"\
      \n  mv \"$$byron.tmp\" \"$$byron\"\ndone\necho \"normalized all pool genesis\
      \ start times to $$shelley_start / $$byron_start\"\n"
    volumes:
    - ./testnet.yaml:/testnet.yaml:ro
    - p1-configs:/configs/1
    - p2-configs:/configs/2
    - p3-configs:/configs/3
    platform: linux/amd64
    init: true
  log-tailer:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/log-tailer@sha256:a5d23c42408a1003bb14208fd97dd2bdda102e7002e4e2a2804e71a80df56484
    container_name: log-tailer
    hostname: log-tailer.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    volumes:
    - tracer:/tracer:ro
    depends_on:
      tracer:
        condition: service_started
    restart: always
    platform: linux/amd64
    init: true
  p1:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment:
      CARDANO_BLOCK_PRODUCER: true
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n\
      \  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect\
      \ /tracer/tracer.socket\n  --shelley-operational-certificate /configs/keys/opcert.cert\n\
      \  --shelley-kes-key /configs/keys/kes.skey\n  --shelley-vrf-key /configs/keys/vrf.skey\n\
      \  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on:
      configurator:
        condition: service_completed_successfully
      tracer-sidecar:
        condition: service_started
    container_name: p1
    hostname: p1.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    volumes:
    - p1-configs:/configs:ro
    - p1-state:/state
    - tracer:/tracer
    platform: linux/amd64
    init: true
  p2:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment:
      CARDANO_BLOCK_PRODUCER: true
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n\
