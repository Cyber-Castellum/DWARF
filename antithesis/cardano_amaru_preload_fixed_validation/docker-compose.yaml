    entrypoint:
    - /bin/bash
    - -o
    - pipefail
    - -c
    command:
    - '/usr/local/bin/dwarf-adversary --network-magic 42 --state-machine-fuzz --sm-connections
      1 --upstream sm-amaru-victim.example:3000 --seed 0x20260907 --sm-conn-ms 750
      2>&1 | tee -a /evidence/fuzzer.log

      '
    volumes:
    - sm-amaru-evidence:/evidence
    depends_on:
      sm-amaru-victim:
        condition: service_healthy
    restart: always
    platform: linux/amd64
    init: true
  sm-amaru-victim:
