    volumes:
    - p1-configs:/configs:ro
    - ./relay-topology.json:/configs/configs/topology.json:ro
    - relay2-state:/state
    - tracer:/tracer
    platform: linux/amd64
    init: true
  sidecar:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/sidecar@sha256:b0eb9b6194c00f6780cae4583cb5620d7140bb55b5d0760b369a428f1e090a43
    container_name: sidecar
    hostname: sidecar.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint:
    - /bin/bash
    - -euo
    - pipefail
    - -c
    command:
    - "until [ -f /amaru-startup/amaru-relay-1.started ] && [ -f /amaru-startup/amaru-relay-2.started\
      \ ]; do\n  sleep 1\ndone\nuntil [ -S /sm-cardano/node.socket ] && [ -f /sm-amaru/.bootstrap-complete\
      \ ]; do\n  sleep 1\ndone\nuntil [ -f /sm-status/prefault-ready ]; do\n  sleep\
      \ 1\ndone\nexec /bin/sidecar\n"
    environment:
      NETWORKMAGIC: '42'
      PORT: '3001'
      POOLS: '3'
    volumes:
    - amaru-startup:/amaru-startup:ro
    - sm-cardano-state:/sm-cardano:ro
    - sm-amaru-state:/sm-amaru:ro
    - sm-cardano-evidence:/sm-cardano-evidence:ro
    - sm-amaru-evidence:/sm-amaru-evidence:ro
    - sm-status:/sm-status:ro
    depends_on:
      tracer-sidecar:
        condition: service_started
      amaru-relay-1:
        condition: service_started
      amaru-relay-2:
        condition: service_started
      sm-workload:
        condition: service_started
    restart: always
    tmpfs:
    - /tmp
    platform: linux/amd64
    init: true
  tracer:
    image: ghcr.io/intersectmbo/cardano-tracer@sha256:da628263a851b419c38d020d3a7dc3b65b20ee84e730faeb74babd6d96f28efe
    container_name: tracer
    hostname: tracer.example
    labels: &id001
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    entrypoint: cardano-tracer
    command: &id002
    - --config
    - /tracer-config.yaml
    volumes:
    - tracer:/opt/cardano-tracer
    - ./tracer-config.yaml:/tracer-config.yaml:ro
    restart: always
    platform: linux/amd64
    init: true
  tracer-sidecar:
    image: ghcr.io/cardano-foundation/cardano-node-antithesis/tracer-sidecar@sha256:8a1e99d61579e37f86b8ed6e1995fa4b6da208028a2f2b94d1def607f56248e6
    container_name: tracer-sidecar
    hostname: tracer-sidecar.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    command:
    - /opt/cardano-tracer/logs
    environment:
      POOLS: '3'
      CHAINPOINT_FILEPATH: /opt/cardano-tracer/chainPoints.log
      AMARU_CONSUMER_HOST: amaru-consumer.example
    volumes:
    - tracer:/opt/cardano-tracer
    restart: always
    depends_on:
      tracer:
        condition: service_started
    platform: linux/amd64
    init: true
  amaru-target-extract:
    image: ghcr.io/j-gainsec/dwarf-sm@sha256:d84e76049c5f13586500a3ceab119b3a7f9842ac3fab32b486c1903d2b7ef167
    user: 0:0
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - temporary=; cleanup() { status=$$?; trap - 0; [ -z "$${temporary:-}" ] || rm
      -f "$$temporary" || true; exit "$$status"; }; abort() { status=$$1; trap - 0
      1 2 3 15; [ -z "$${temporary:-}" ] || rm -f "$$temporary" || true; exit "$$status";
      }; trap cleanup 0; trap 'abort 129' 1; trap 'abort 130' 2; trap 'abort 131'
      3; trap 'abort 143' 15; temporary=$$(mktemp /target/.amaru.XXXXXX); cp /usr/local/bin/amaru
      "$$temporary"; chmod 0755 "$$temporary"; mv -f "$$temporary" /target/amaru;
      temporary=; trap - 0 1 2 3 15
    volumes:
    - type: volume
      source: amaru-target-bin
      target: /target
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
    platform: linux/amd64
    container_name: amaru-target-extract
    hostname: amaru-target-extract
    init: true
  sm-amaru-fuzzer:
    image: ghcr.io/j-gainsec/dwarf-adversary@sha256:c5e35065b9a58c337cd770ef0317bf11c1057a5869d654f7873275d3c8fe1aa1
    container_name: sm-amaru-fuzzer
    hostname: sm-amaru-fuzzer.example
