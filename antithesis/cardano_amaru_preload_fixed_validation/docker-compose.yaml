    platform: linux/amd64
    init: true
  sm-cardano-seed:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    container_name: sm-cardano-seed
    hostname: sm-cardano-seed.example
    entrypoint:
    - /bin/bash
    - -euo
    - pipefail
    - -c
    command:
    - "while [ ! -f /amaru-state/.bootstrap-complete ]; do sleep 5; done\nif [ -f\
      \ /seed/.seed-complete ]; then exit 0; fi\nwhile :; do\n  rm -rf /seed/.copy-tmp\n\
      \  mkdir -p /seed/.copy-tmp\n  if cp -a /live/immutable /live/ledger /live/volatile\
      \ /live/protocolMagicId /live/lock /seed/.copy-tmp/; then\n    for entry in\
      \ /seed/*; do\n      [ \"$${entry}\" = /seed/.copy-tmp ] && continue\n     \
      \ [ -e \"$${entry}\" ] && rm -rf \"$${entry}\"\n    done\n    for entry in /seed/.copy-tmp/*;\
      \ do mv \"$${entry}\" /seed/; done\n    rmdir /seed/.copy-tmp\n    : > /seed/.seed-complete\n\
      \    exit 0\n  fi\n  rm -rf /seed/.copy-tmp\n  sleep 5\ndone\n"
    volumes:
    - p1-state:/live:ro
    - a1-state:/amaru-state:ro
    - sm-cardano-state:/seed
    depends_on:
      p1:
        condition: service_started
      amaru-relay-1:
        condition: service_started
    restart: on-failure
    platform: linux/amd64
    init: true
  sm-cardano-victim:
    image: ghcr.io/j-gainsec/dwarf-sm@sha256:09febf5ece94bdb82b657d5711802f5b3d1656c2c9e2c95f60814d5088c72d45
    environment:
      CARDANO_BLOCK_PRODUCER: false
      DWARF_CARDANO_MEASUREMENT_TRACE: /evidence/cardano-measurement.ndjson
      DWARF_CARDANO_PLUTUS_TRACE: /evidence/cardano-plutus.ndjson
    command:
    - 'exec /usr/local/bin/cardano-node run --topology /configs/configs/topology.json
      --config /configs/configs/config.json --database-path /state --socket-path /state/node.socket
      --tracer-socket-path-connect /tracer/tracer.socket --port 3001 --host-addr 0.0.0.0
      +RTS -N1 -A16m -qg -qb -RTS > /evidence/cardano.log 2>&1

      '
    restart: always
    depends_on:
