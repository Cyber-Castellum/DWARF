    - ./sm-cardano-topology.json:/configs/configs/topology.json:ro
    - sm-cardano-state:/state
    - sm-cardano-runtime-evidence:/evidence
    - measurement-tracer-sm-cardano-victim:/tracer
    healthcheck:
