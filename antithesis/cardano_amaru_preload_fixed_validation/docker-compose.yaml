      AMARU_BIN: /target/amaru
      AMARU_MIGRATE_CHAIN_DB: 'true'
      AMARU_WITH_JSON_TRACES: 'true'
    restart: always
    container_name: sm-amaru-victim
    hostname: sm-amaru-victim.example
    command:
    - 'exec amaru-relay-bootstrap > /evidence/amaru.log 2>&1

      '
    volumes:
    - p1-state:/live:ro
    - p1-configs:/cardano/config:ro
    - ./amaru-runtime:/amaru-runtime:ro
    - amaru-startup:/startup
    - sm-amaru-state:/srv/amaru
    - sm-amaru-runtime-evidence:/evidence
    - type: volume
      source: amaru-target-bin
      target: /target
      read_only: true
    depends_on:
      p1:
        condition: service_started
      sm-cardano-seed:
        condition: service_completed_successfully
      amaru-target-extract:
        condition: service_completed_successfully
        required: true
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /srv/amaru/.bootstrap-complete && timeout 2 bash -c '</dev/tcp/127.0.0.1/3000'
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    platform: linux/amd64
    init: true
  sm-cardano-fuzzer:
    image: ghcr.io/j-gainsec/dwarf-adversary@sha256:c5e35065b9a58c337cd770ef0317bf11c1057a5869d654f7873275d3c8fe1aa1
    container_name: sm-cardano-fuzzer
