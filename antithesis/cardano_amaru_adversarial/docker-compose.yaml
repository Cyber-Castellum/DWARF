    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect /tracer/tracer.socket\n  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on: *id005
    labels: *id001
    hostname: relay1.example
    volumes:
    - p1-configs:/configs:ro
    - ./relay-topology.json:/configs/configs/topology.json:ro
    - relay1-state:/state
    - tracer:/tracer
  relay2:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment: *id004
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect /tracer/tracer.socket\n  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on: *id005
    labels: *id001
    hostname: relay2.example
    volumes:
    - p1-configs:/configs:ro
    - ./relay-topology.json:/configs/configs/topology.json:ro
    - relay2-state:/state
    - tracer:/tracer
  cardano-phase1-reference:
    image: ghcr.io/j-gainsec/dwarf-cardano-phase1-reference@sha256:cadd549396712c649f6f5683fab36fa6c183b8db0f85440a82a05b59bbcb39e4
    hostname: cardano-phase1-reference.example
    labels: *id001
    volumes:
    - phase1-reference-state:/state
    restart: always
  cardano-submit-api:
    image: ghcr.io/intersectmbo/cardano-submit-api:10.7.1
    hostname: cardano-submit-api.example
    labels: *id001
    command:
    - --config
    - /cfg/submit-api-config.yaml
    - --testnet-magic
    - '42'
    - --socket-path
    - /state/node.socket
    - --listen-address
    - 0.0.0.0
    - --port
    - '8090'
    volumes:
    - phase1-reference-state:/state
    - ./haskell:/cfg:ro
    restart: always
    depends_on:
      cardano-phase1-reference:
        condition: service_started
  dwarf-adversary:
    image: ghcr.io/j-gainsec/dwarf-adversary-anti@sha256:e99cb81ffc51465042b77ac3100d18092f69a25c36c66fff4954663b7200d2bd
    hostname: dwarf-adversary.example
    labels:
      com.antithesis.exclude_from_faults: network,kill,pause,stop
