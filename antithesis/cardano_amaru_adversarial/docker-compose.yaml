    command:
    - mkdir -p /opt/amaru-logs && exec /usr/local/bin/dwarf-amaru-entrypoint.sh 2>&1 | tee -a /opt/amaru-logs/amaru-relay-2.log
    volumes:
    - a2-state:/srv/amaru
    - amaru-logs:/opt/amaru-logs
    - ./relay-image/entrypoint.sh:/usr/local/bin/dwarf-amaru-entrypoint.sh:ro
