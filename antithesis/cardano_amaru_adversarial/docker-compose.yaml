      ADV_RELAY_LOG: amaru-relay-1.log
      HONEST_RELAY_LOG: amaru-relay-2.log
    volumes:
    - amaru-logs:/opt/amaru-logs:ro
    depends_on:
      amaru-relay-1:
        condition: service_started
      amaru-relay-2:
        condition: service_started
