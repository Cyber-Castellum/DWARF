    depends_on: *id003
    labels: *id001
    hostname: p1.example
    volumes:
    - p1-configs:/configs:ro
    - p1-state:/state
    - tracer:/tracer
  p2:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment: *id002
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect /tracer/tracer.socket\n  --shelley-operational-certificate /configs/keys/opcert.cert\n  --shelley-kes-key /configs/keys/kes.skey\n  --shelley-vrf-key /configs/keys/vrf.skey\n  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
    restart: always
    depends_on: *id003
    labels: *id001
    hostname: p2.example
    volumes:
    - p2-configs:/configs:ro
    - p2-state:/state
    - tracer:/tracer
  p3:
    image: ghcr.io/intersectmbo/cardano-node@sha256:3275d357053d21f3220f74b0854fd584e1fe322dfa1bbb78effd760c3191d14c
    environment: *id002
    command: "run --topology /configs/configs/topology.json\n  --config /configs/configs/config.json\n  --database-path /state\n  --socket-path /state/node.socket\n  --tracer-socket-path-connect /tracer/tracer.socket\n  --shelley-operational-certificate /configs/keys/opcert.cert\n  --shelley-kes-key /configs/keys/kes.skey\n  --shelley-vrf-key /configs/keys/vrf.skey\n  --port 3001\n  --host-addr 0.0.0.0\n  +RTS -N -A16m -qg -qb -RTS\n"
