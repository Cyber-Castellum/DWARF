    entrypoint:
    - /bin/sh
    - -c
    environment:
      AMARU_LOG: error,amaru=info
      AMARU_TRACE: info
      AMARU_COLOR: never
      AMARU_GLOBAL_CONSENSUS_SECURITY_PARAM: '20'
      AMARU_GLOBAL_ACTIVE_SLOT_COEFF_INVERSE: '5'
      AMARU_GLOBAL_EPOCH_LENGTH_SCALE_FACTOR: '4'
      AMARU_GLOBAL_MAX_LOVELACE_SUPPLY: '45000000000000000'
      AMARU_GLOBAL_SLOTS_PER_KES_PERIOD: '129600'
      AMARU_GLOBAL_MAX_KES_EVOLUTION: '62'
      AMARU_PEER_ADDRESS: relay1.example:3001,dwarf-adversary.example:3001
      AMARU_LISTEN_ADDRESS: 0.0.0.0:3001
      AMARU_SUBMIT_API_ADDRESS: 0.0.0.0:3011
      AMARU_STORE: /srv/amaru
      AMARU_GLOBAL_SYSTEM_START: '1787197790000'
    restart: always
    depends_on:
      dwarf-adversary:
        condition: service_started
    hostname: amaru-relay-1.example
    command:
    - mkdir -p /opt/amaru-logs && exec /usr/local/bin/dwarf-amaru-entrypoint.sh 2>&1 | tee -a /opt/amaru-logs/amaru-relay-1.log
    volumes:
    - a1-state:/srv/amaru
    - amaru-logs:/opt/amaru-logs
    - ./relay-image/entrypoint.sh:/usr/local/bin/dwarf-amaru-entrypoint.sh:ro
    networks:
      default: null
      amaru-consumer-net:
        aliases:
        - amaru-relay-1.example
  amaru-relay-2:
    image: ghcr.io/j-gainsec/amaru-adv@sha256:e7d3aa4ce3bd14bd08a08b998b6486fbe13cfd4430aa0c9489ab4de5e8e6934c
    entrypoint:
    - /bin/sh
    - -c
    environment:
      AMARU_LOG: error,amaru=info
